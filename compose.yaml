services:
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=hook
      - POSTGRES_PASSWORD=hook
      - POSTGRES_DB=hookrelay
    ports:
      - 5433:5432
    volumes:
      - hookrelay-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hook -d hookrelay"]
      timeout: 5s
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: hookrelay_redis
    ports:
      - "6379:6379"
    command: ["redis-server","--appendonly","yes","--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    restart:
      unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  hookrelay-pgdata:
  redis-data: